name: matchprediction

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: matchprediction-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGODB_URI: mongodb://mongo-shared:27017/matchprediction
      PORT: 4001
    networks:
      - app
      - vm_shared

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: matchprediction-frontend
    restart: unless-stopped
    environment:
      PORT: 4000
    depends_on:
      - backend
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: matchprediction-nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app

networks:
  app:
    name: matchprediction-app
  vm_shared:
    name: vm-shared
    external: true